version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pierceai_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    container_name: pierceai_app
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./assets:/app/assets

volumes:
  pgdata: